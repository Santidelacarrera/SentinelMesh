# Local dev stack. Secrets below are throwaway dev values — override via .env for anything shared.
services:
  redis:
    image: redis:7-alpine
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: dev-only, POSTGRES_DB: sentinelmesh }
    volumes: ["./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: dev-only, MINIO_ROOT_PASSWORD: dev-only-secret }
    ports: ["9001:9001"]
  analytics:
    build: ./services/analytics
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      ANALYTICS_URL: http://analytics:8000
      OBJECT_STORE_DIR: /data/objects
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:-dev-only-change-me}
    volumes: ["objects:/data/objects"]
    depends_on: [redis, analytics]
    ports: ["3000:3000"]
volumes: { objects: {} }
