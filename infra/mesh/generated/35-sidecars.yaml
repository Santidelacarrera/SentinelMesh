# GENERADO por infra/mesh/generate.mjs desde services.yaml — no editar a mano.
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: shadowapi-guard
  namespace: segundo-cerebro
  labels:
    app.kubernetes.io/part-of: segundo-cerebro
    app.kubernetes.io/managed-by: mesh-generator
spec:
  workloadSelector:
    labels:
      app: shadowapi-guard
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  egress:
    - hosts:
        - istio-system/*
        - ./contextrag-engine.segundo-cerebro.svc.cluster.local
        - ./sentinelmesh-api.segundo-cerebro.svc.cluster.local
        - observability/otel-collector.observability.svc.cluster.local
