# GENERADO por infra/mesh/generate.mjs desde services.yaml — no editar a mano.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: shadowapi-guard
  namespace: segundo-cerebro
  labels:
    app.kubernetes.io/part-of: segundo-cerebro
    app.kubernetes.io/managed-by: mesh-generator
spec:
  host: shadowapi-guard.segundo-cerebro.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 1s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 200
        maxRequestsPerConnection: 0
        maxRetries: 3
        idleTimeout: 60s
    outlierDetection:
      consecutive5xxErrors: 5
      consecutiveGatewayErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
      splitExternalLocalOriginErrors: true
      consecutiveLocalOriginFailures: 5
    loadBalancer:
      simple: LEAST_REQUEST
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: shadowapi-guard
  namespace: segundo-cerebro
  labels:
    app.kubernetes.io/part-of: segundo-cerebro
    app.kubernetes.io/managed-by: mesh-generator
spec:
  hosts:
    - shadowapi-guard.segundo-cerebro.svc.cluster.local
  http:
    - name: read
      match:
        - method:
            regex: GET|HEAD
      route:
        - destination:
            host: shadowapi-guard.segundo-cerebro.svc.cluster.local
            port:
              number: 8080
      timeout: 8s
      retries:
        attempts: 2
        retryOn: connect-failure,refused-stream,unavailable,reset
    - name: write
      match:
        - method:
            regex: POST|PUT|PATCH|DELETE
      route:
        - destination:
            host: shadowapi-guard.segundo-cerebro.svc.cluster.local
            port:
              number: 8080
      timeout: 8s
      retries:
        attempts: 0
---
